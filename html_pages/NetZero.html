<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explaining SeaCURE</title>
    <style>
        /* =========================================
           CONFIGURATION AREA - CHANGE COLORS HERE
        ========================================= */
        :root {
            /* Main Titles (H1) */
            --title-color: #5DAF8B; /* Deep blue/grey */
            
            /* Subtitles (H2) */
            --subtitle-color: #335E96; /* Slightly lighter blue */
            
            /* Standard Body Text */
            --body-text-color: #333333; /* Dark grey (easier to read than pure black) */
            
            /* The clickable interactive links */
            --interactive-color: #0000FF; /* Currently Orange - Change me! */
            
            /* The hover background for interactive links */
            --interactive-hover-bg: #fbeee6; /* Light orange fade */
            
            /* Page Background */
            --main-bg-color: #ffffff;
        }

        /* --- Basic Page Styling --- */
        body {
            font-family: sans-serif;
            line-height: 1.6;
            /* Using the variables defined above */
            color: var(--body-text-color);
            background-color: var(--main-bg-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { color: var(--title-color); }
        h2 { color: var(--subtitle-color); }
        
        /* --- Header & Logo Styling --- */
        .project-header {
            text-align: center; /* Centers everything in header */
            margin-bottom: 40px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .logo-wrapper {
            /* Flex allows easy side-by-side logos if needed */
            display: flex; 
            justify-content: center;
            gap: 20px; /* Space between logos */
            margin-bottom: 15px;
        }
        .project-logo {
            max-height: 80px; /* Ensures logos don't dominate the page */
            width: auto;
        }

        /* --- Standard Images in text --- */
        img.standard-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* --- Video Styling --- */
        .video-container {
            width: 100%;
            aspect-ratio: 9 / 9; /* Or whatever shape you want the frame to be */
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .standard-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This forces the video to fill the entire container */
            display: block;
        }


        img.responsive {
            max-width: 100%;
            height: auto;         
            display: block;       
            margin-inline: auto;  
        }
    </style>
</head>
<body>

    <header class="project-header">
        <h1>Net Zero</h1>
    </header>

    <main>
        <section>
            <p>
                Net Zero means that the greenhouse gases we can't avoid releasing into the atmosphere need to be
                balanced by the removal of CO<sub>2</sub> from the atmosphere.
                We may also need to remove carbon that has already been emitted into the atmosphere.
            </p>

            <div class="video-container">
                <video 
                    controls 
                    loop 
                    muted 
                    autoplay 
                    playsinline 
                    class="standard-video">
                    <source src="net_zero.mp4" type="video/quicktime">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>
    </main>

</body>
</html>
